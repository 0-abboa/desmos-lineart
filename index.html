<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image to line art</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;display:flex;height:100vh}
  #side{width:320px;padding:16px;box-sizing:border-box;border-right:1px solid #ddd;overflow:auto;flex:none}
  #side h3{margin:0 0 8px}
  #side label{display:block;margin-top:10px;font-size:13px}
  #side input[type=range],#side select{width:100%}
  #side button{margin-top:10px;padding:8px;width:100%;cursor:pointer}
  .grp[hidden]{display:none}
  #main{flex:1;background:#fff;min-width:0}
  #svg{width:100%;height:100%;display:block}
  .muted{color:#666;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div id="side">
  <h3>Image to line art</h3>
  <input type="file" id="file" accept="image/*">

  <label>Output
    <select id="mode">
      <option value="vector">Line art (vector trace)</option>
      <option value="both">Curves + shading</option>
      <option value="curves">Curves only</option>
      <option value="hatch">Shading only</option>
    </select>
  </label>

  <label>Resolution <span id="resV"></span>
    <input type="range" id="res" min="200" max="800" step="20" value="700"></label>

  <div class="grp" data-grp="vector">
    <label>Colours <span id="colorsV"></span>
      <input type="range" id="colors" min="2" max="16" step="1" value="6"></label>
    <label>Cleanup <span id="simplifyV"></span>
      <input type="range" id="simplify" min="0" max="80" step="2" value="40"></label>
    <label>Denoise <span id="blurV"></span>
      <input type="range" id="blur" min="0" max="3" step="1" value="2"></label>
    <label>Line width <span id="lwV"></span>
      <input type="range" id="lw" min="0.4" max="2.4" step="0.1" value="0.9"></label>
    <label><input type="checkbox" id="fill" /> Fill shapes (icons, logos)</label>
  </div>

  <div class="grp" data-grp="sketch" hidden>
    <label>Contrast <span id="gammaV"></span>
      <input type="range" id="gamma" min="0.4" max="2.2" step="0.05" value="1"></label>
    <label>Smoothing <span id="smoothV"></span>
      <input type="range" id="smooth" min="1" max="8" step="1" value="4"></label>
    <label>Line spacing <span id="spacingV"></span>
      <input type="range" id="spacing" min="1.2" max="4" step="0.1" value="2.2"></label>
    <label>Darkness floor <span id="thrV"></span>
      <input type="range" id="thr" min="0.02" max="0.40" step="0.01" value="0.12"></label>
    <label>Curve detail <span id="detailV"></span>
      <input type="range" id="detail" min="1" max="9" step="1" value="5"></label>
  </div>

  <button id="draw">Draw image</button>
  <button id="clear">Clear</button>
  <button id="save">Save as SVG</button>

  <p id="info" class="muted"></p>
  <p class="muted"><b>Line art</b> traces flat colour regions into smooth curves — best for graphics, game screenshots and logos. Two-tone icons and logos are detected automatically and traced at 2 colours. <b>Curves + shading</b> suits photographs. Raise <b>Cleanup</b> if texture noise appears.</p>
</div>
<div id="main"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>

<script src="imagetracer.js"></script>
<script src="contour.js"></script>
<script src="sketch.js"></script>
<script src="lineart.js"></script>
<script>
const $ = id => document.getElementById(id);
let img = null, lastArt = null;

const SHOWN = ['res','colors','simplify','blur','lw','gamma','smooth','spacing','thr','detail'];
SHOWN.forEach(id => {
  const show = () => { const v = $(id + 'V'); if (v) v.textContent = $(id).value; };
  $(id).addEventListener('input', show); show();
});

function syncGroups() {
  const mode = $('mode').value;
  document.querySelectorAll('.grp').forEach(g => {
    const v = g.dataset.grp;
    g.hidden = mode === 'vector' ? v !== 'vector' : v !== 'sketch';
  });
}
$('mode').addEventListener('change', syncGroups);
syncGroups();

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const im = new Image();
  im.onload = () => {
    img = im;
    $('info').textContent = `Loaded ${im.width}x${im.height}. Click Draw image.`;
  };
  im.src = URL.createObjectURL(f);
});

// Image -> canvas at limited resolution.
function drawToCanvas() {
  const R = +$('res').value;
  const s = Math.min(1, R / Math.max(img.width, img.height));
  const w = Math.max(8, Math.round(img.width * s));
  const h = Math.max(8, Math.round(img.height * s));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  return { canvas: c, ctx, w, h };
}

function gridFrom(ctx, w, h) {
  const px = ctx.getImageData(0, 0, w, h).data;
  const gam = +$('gamma').value;
  const v = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const L = (0.299 * px[4*i] + 0.587 * px[4*i+1] + 0.114 * px[4*i+2]) / 255;
    v[i] = Math.pow(1 - L, gam);
  }
  return { w, h, v };
}

// Flat two-tone art (icons, logos, existing line art) must not be traced as if
// it were a photograph: extra palette entries land on anti-aliasing and JPEG
// noise, shattering one clean shape into hundreds of jagged scraps.
function isBitonal(ctx, w, h) {
  const px = ctx.getImageData(0, 0, w, h).data;
  const n = w * h;
  let flat = 0;
  for (let i = 0; i < n; i++) {
    const L = (0.299 * px[4*i] + 0.587 * px[4*i+1] + 0.114 * px[4*i+2]) / 255;
    if (L < 0.2 || L > 0.8) flat++;
  }
  return flat / n > 0.85;
}

function viewport(gw, gh) {
  const svg = $('svg');
  const W = Math.round(svg.clientWidth || window.innerWidth * 0.66);
  const H = Math.round(svg.clientHeight || window.innerHeight);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pad = 16;
  const sc = Math.min((W - 2*pad) / gw, (H - 2*pad) / gh);
  const ox = (W - gw*sc) / 2, oy = (H - gh*sc) / 2;
  return { W, H, sc, ox, oy };
}

// ---- vector trace: real Bezier outlines ----
function renderVector(tracerSvg, gw, gh, filled) {
  const { W, H, sc, ox, oy } = viewport(gw, gh);
  const doc = new DOMParser().parseFromString(tracerSvg, 'image/svg+xml');
  const paths = Array.from(doc.querySelectorAll('path'));
  const lw = (+$('lw').value / sc).toFixed(3);
  let html = `<rect width="${W}" height="${H}" fill="#fff"/><g transform="translate(${ox.toFixed(2)},${oy.toFixed(2)}) scale(${sc.toFixed(4)})">`;
  for (const p of paths) {
    const d = p.getAttribute('d');
    if (!d) continue;
    // Outlining a thick stroke traces both of its edges, which reads as a
    // doubled line; keeping the traced fills reproduces the shape faithfully.
    const fill = filled ? (p.getAttribute('fill') || '#000') : 'none';
    const stroke = filled ? 'none' : '#000';
    html += `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  html += '</g>';
  $('svg').innerHTML = html;
  return paths.length;
}

// ---- tone renderers (hatching + traced edge curves) ----
function renderTone(art) {
  const { W, H, sc, ox, oy } = viewport(art.gridW, art.gridH);
  const X = x => ox + x*sc, Y = y => oy + y*sc;
  let html = `<rect width="${W}" height="${H}" fill="#fff"/>`;

  if (art.hatch && art.hatch.strokes.length) {
    const buckets = new Map();
    for (const st of art.hatch.strokes) {
      const key = Math.round(st.width * 4) / 4;
      let d = buckets.get(key) || '';
      d += `M${X(st.xs[0]).toFixed(1)} ${Y(st.ys[0]).toFixed(1)}`;
      for (let i = 1; i < st.xs.length; i++) {
        d += `L${X(st.xs[i]).toFixed(1)} ${Y(st.ys[i]).toFixed(1)}`;
      }
      buckets.set(key, d);
    }
    for (const [wgt, d] of buckets) {
      html += `<path d="${d}" fill="none" stroke="#000" stroke-width="${Math.min(0.75, wgt).toFixed(2)}" stroke-linecap="round"/>`;
    }
  }

  if (art.curves && art.curves.lines.length) {
    let d = '';
    for (const pts of art.curves.lines) {
      d += `M${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i+1][0]) / 2;
        const my = (pts[i][1] + pts[i+1][1]) / 2;
        d += `Q${X(pts[i][0]).toFixed(1)} ${Y(pts[i][1]).toFixed(1)} ${X(mx).toFixed(1)} ${Y(my).toFixed(1)}`;
      }
      const last = pts[pts.length-1];
      d += `L${X(last[0]).toFixed(1)} ${Y(last[1]).toFixed(1)}`;
    }
    html += `<path d="${d}" fill="none" stroke="#000" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>`;
  }

  $('svg').innerHTML = html;
}

$('draw').addEventListener('click', () => {
  if (!img) { $('info').textContent = 'Pick an image first.'; return; }
  $('info').textContent = 'Drawing...';
  setTimeout(() => {
    try {
      const mode = $('mode').value;
      const { ctx, w, h } = drawToCanvas();
      const t0 = performance.now();

      if (mode === 'vector') {
        if (typeof ImageTracer === 'undefined') throw new Error('tracer failed to load');
        const bitonal = isBitonal(ctx, w, h);
        if (bitonal) {
          $('colors').value = 2;
          $('simplify').value = 0;
          $('blur').value = 1;
          ['colors', 'simplify', 'blur'].forEach(id => { $(id + 'V').textContent = $(id).value; });
        }
        $('fill').checked = bitonal;
        const opts = {
          // Force 2 for flat art: a third entry lands on the anti-aliasing halo
          // and explodes one shape into hundreds of scraps.
          numberofcolors: bitonal ? 2 : +$('colors').value,
          ltres: bitonal ? 3 : 2, qtres: bitonal ? 3 : 2,
          pathomit: +$('simplify').value,
          rightangleenhance: !bitonal,
          blurradius: +$('blur').value,
          strokewidth: 0,
          linefilter: false,
          scale: 1, roundcoords: 2, viewbox: true, desc: false
        };
        const imgd = ctx.getImageData(0, 0, w, h);
        const svgStr = ImageTracer.imagedataToSVG(imgd, opts);
        const filled = $('fill').checked;
        const n = renderVector(svgStr, w, h, filled);
        const ms = Math.round(performance.now() - t0);
        lastArt = { vector: svgStr, gridW: w, gridH: h, filled };
        $('info').textContent = `${n} curves, ${bitonal ? 2 : +$('colors').value} colours, ${ms}ms${bitonal ? ' (flat art detected)' : ''}.`;
        return;
      }

      const grid = gridFrom(ctx, w, h);
      let hatch = null, curves = null;
      if (mode !== 'curves') {
        hatch = buildLineArt(grid, {
          preBlur: +$('smooth').value,
          spacing: +$('spacing').value,
          thr: +$('thr').value,
          edgePass: false
        });
      }
      if (mode !== 'hatch') {
        const gate = 0.02 + (+$('detail').value - 1) * 0.02;
        curves = buildSketch(grid, { sigmas: [1.2, 3.0], gate, eps: 0.6, smoothIters: 2 });
      }

      const ms = Math.round(performance.now() - t0);
      lastArt = { hatch, curves, gridW: grid.w, gridH: grid.h };
      renderTone(lastArt);

      const parts = [];
      if (hatch) parts.push(`${hatch.strokes.length} hatch strokes`);
      if (curves) parts.push(`${curves.count} curves (${curves.points} pts)`);
      parts.push(`${ms}ms`);
      $('info').textContent = parts.join(', ') + '.';
    } catch (err) {
      $('info').textContent = 'Error: ' + err.message;
      throw err;
    }
  }, 30);
});

$('clear').addEventListener('click', () => {
  $('svg').innerHTML = '';
  $('info').textContent = '';
  lastArt = null;
});

$('save').addEventListener('click', () => {
  if (!lastArt) { $('info').textContent = 'Draw something first.'; return; }
  const svg = $('svg');
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', svg.clientWidth || 900);
  clone.setAttribute('height', svg.clientHeight || 900);
  const blob = new Blob([clone.outerHTML], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lineart.svg';
  a.click();
  URL.revokeObjectURL(a.href);
});

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (!lastArt) return;
    if (lastArt.vector) renderVector(lastArt.vector, lastArt.gridW, lastArt.gridH, lastArt.filled);
    else renderTone(lastArt);
  }, 150);
});
</script>
</body>
</html>

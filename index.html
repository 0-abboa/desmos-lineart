<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image to line art</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;display:flex;height:100vh}
  #side{width:330px;padding:16px;box-sizing:border-box;border-right:1px solid #ddd;overflow:auto;flex:none}
  #side h3{margin:0 0 8px}
  #side h4{margin:16px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#888}
  #side label{display:block;margin-top:10px;font-size:13px}
  #side input[type=range],#side select{width:100%}
  #side button{margin-top:10px;padding:8px;width:100%;cursor:pointer}
  #main{flex:1;background:#fff;min-width:0}
  #svg{width:100%;height:100%;display:block}
  .muted{color:#666;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div id="side">
  <h3>Image to line art</h3>
  <input type="file" id="file" accept="image/*">

  <label>Output
    <select id="mode">
      <option value="auto">Auto (recommended)</option>
      <option value="line">Single-line art</option>
      <option value="vector">Outline trace</option>
    </select>
  </label>

  <label>Resolution <span id="resV"></span>
    <input type="range" id="res" min="300" max="900" step="20" value="700"></label>

  <h4>Single-line</h4>
  <label>Softness (sigma) <span id="sigmaV"></span>
    <input type="range" id="sigma" min="0.8" max="3.0" step="0.1" value="1.8"></label>
  <label>Ink threshold <span id="tauV"></span>
    <input type="range" id="tau" min="0.30" max="0.70" step="0.01" value="0.45"></label>
  <label>Cleanup <span id="cleanupV"></span>
    <input type="range" id="cleanup" min="0" max="40" step="1" value="8"></label>
  <label>Line width <span id="lwLineV"></span>
    <input type="range" id="lwLine" min="0.4" max="2.4" step="0.1" value="1.4"></label>

  <h4>Outline trace</h4>
  <label>Colours <span id="colorsV"></span>
    <input type="range" id="colors" min="2" max="16" step="1" value="4"></label>
  <label>Cleanup <span id="simplifyV"></span>
    <input type="range" id="simplify" min="0" max="80" step="2" value="60"></label>
  <label>Denoise <span id="blurV"></span>
    <input type="range" id="blur" min="0" max="3" step="1" value="2"></label>
  <label>Line width <span id="lwVecV"></span>
    <input type="range" id="lwVec" min="0.4" max="2.4" step="0.1" value="0.9"></label>
  <label><input type="checkbox" id="bgClean" checked /> Clean background</label>

  <button id="draw">Draw image</button>
  <button id="clear">Clear</button>
  <button id="save">Save as SVG</button>
  <button id="desmos">Export for Desmos</button>
  <div id="desmosWrap" hidden>
    <p class="muted" id="desmosInfo"></p>
    <textarea id="desmosOut" rows="6" style="width:100%;font-size:11px;font-family:ui-monospace,monospace"></textarea>
    <button id="copyDesmos">Copy expressions</button>
    <button id="copyColor">Copy colour script</button>
  </div>

  <p id="info" class="muted"></p>
  <p class="muted"><b>Auto</b> picks an engine from the image: flat icons get a hard threshold, sketches get XDoG ink extraction, photographs get a flat-colour outline trace. Override with the Output menu.</p>
</div>
<div id="main"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>

<script src="imagetracer.js"></script>
<script src="skeleton.js"></script>
<script>
const $ = id => document.getElementById(id);
let img = null, lastArt = null, lastExport = null, lastBgColor = 'rgb(255,255,255)';

const SHOWN = ['res','sigma','tau','cleanup','lwLine','colors','simplify','blur','lwVec'];
SHOWN.forEach(id => {
  const show = () => { const v = $(id + 'V'); if (v) v.textContent = $(id).value; };
  $(id).addEventListener('input', show); show();
});

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const im = new Image();
  im.onload = () => {
    img = im;
    $('info').textContent = `Loaded ${im.width}x${im.height}. Click Draw image.`;
  };
  im.src = URL.createObjectURL(f);
});

// Scale to the working resolution in both directions: a small source has too
// few pixels for any renderer to find strokes, so upscale rather than trace a
// thumbnail. Capped so a tiny icon does not become mush.
function drawToCanvas() {
  const R = +$('res').value;
  const s = Math.min(4, R / Math.max(img.width, img.height));
  const w = Math.max(8, Math.round(img.width * s));
  const h = Math.max(8, Math.round(img.height * s));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);
  return { ctx, w, h };
}

function gridFrom(ctx, w, h) {
  const px = ctx.getImageData(0, 0, w, h).data;
  const v = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const L = (0.299 * px[4*i] + 0.587 * px[4*i+1] + 0.114 * px[4*i+2]) / 255;
    v[i] = 1 - L;
  }
  return { w, h, v };
}

// flat   -> two-tone art: exact threshold keeps shapes crisp
// sketch -> ink on light paper: XDoG keeps faint strokes connected
// photo  -> continuous tone: flat-colour outline trace is the only one that holds a face
function classify(ctx, w, h) {
  const px = ctx.getImageData(0, 0, w, h).data;
  const n = w * h;
  let flat = 0, dark = 0, sum = 0;
  for (let i = 0; i < n; i++) {
    const L = (0.299 * px[4*i] + 0.587 * px[4*i+1] + 0.114 * px[4*i+2]) / 255;
    sum += L;
    if (L < 0.2 || L > 0.8) flat++;
    if (L < 0.35) dark++;
  }
  const mean = sum / n;
  const flatFrac = flat / n;
  const darkFrac = dark / n;
  if (flatFrac > 0.85) return 'flat';
  if (mean > 0.62 && darkFrac > 0.005 && darkFrac < 0.35) return 'sketch';
  return 'photo';
}

function viewport(gw, gh) {
  const svg = $('svg');
  const W = Math.round(svg.clientWidth || window.innerWidth * 0.66);
  const H = Math.round(svg.clientHeight || window.innerHeight);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pad = 16;
  const sc = Math.min((W - 2*pad) / gw, (H - 2*pad) / gh);
  const ox = (W - gw*sc) / 2, oy = (H - gh*sc) / 2;
  return { W, H, sc, ox, oy };
}

function strokePath(lines, X, Y) {
  let d = '';
  for (const pts of lines) {
    if (!pts || pts.length < 2) continue;
    d += `M${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i+1][0]) / 2;
      const my = (pts[i][1] + pts[i+1][1]) / 2;
      d += `Q${X(pts[i][0]).toFixed(1)} ${Y(pts[i][1]).toFixed(1)} ${X(mx).toFixed(1)} ${Y(my).toFixed(1)}`;
    }
    const last = pts[pts.length - 1];
    d += `L${X(last[0]).toFixed(1)} ${Y(last[1]).toFixed(1)}`;
  }
  return d;
}

function renderLines(lines, gw, gh, lw) {
  const { W, H, sc, ox, oy } = viewport(gw, gh);
  const X = x => ox + x*sc, Y = y => oy + y*sc;
  const d = strokePath(lines, X, Y);
  $('svg').innerHTML = `<rect width="${W}" height="${H}" fill="#fff"/>` +
    `<path d="${d}" fill="none" stroke="#000" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function renderVector(tracerSvg, gw, gh, filled, lw) {
  const { W, H, sc, ox, oy } = viewport(gw, gh);
  const doc = new DOMParser().parseFromString(tracerSvg, 'image/svg+xml');
  const paths = Array.from(doc.querySelectorAll('path'));
  const sw = (lw / sc).toFixed(3);
  let html = `<rect width="${W}" height="${H}" fill="#fff"/><g transform="translate(${ox.toFixed(2)},${oy.toFixed(2)}) scale(${sc.toFixed(4)})">`;
  for (const p of paths) {
    const d = p.getAttribute('d');
    if (!d) continue;
    const fill = filled ? (p.getAttribute('fill') || '#000') : 'none';
    const stroke = filled ? 'none' : '#000';
    html += `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  html += '</g>';
  $('svg').innerHTML = html;
  return paths.length;
}

// Flatten an imagetracer path (line + quadratic segments) into polygon points.
function flattenPath(smp) {
  const segs = smp.segments || [];
  const pts = [];
  if (!segs.length) return pts;
  pts.push([segs[0].x1, segs[0].y1]);
  for (const s of segs) {
    if (s.x3 !== undefined) {
      const { x1, y1, x2, y2, x3, y3 } = s;
      for (let i = 1; i <= 5; i++) {
        const t = i / 5, u = 1 - t;
        pts.push([u*u*x1 + 2*u*t*x2 + t*t*x3, u*u*y1 + 2*u*t*y2 + t*t*y3]);
      }
    } else {
      pts.push([s.x2, s.y2]);
    }
  }
  return pts;
}

// Simplify a CLOSED polygon. Feeding a ring straight to RDP degenerates it:
// first and last vertex coincide, the baseline has zero length, every point
// measures as zero distance, and the ring collapses to two points. Split the
// ring at its furthest vertex and simplify each half instead.
function simplifyPolygon(pts, eps) {
  if (pts.length < 4) return pts;
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  let ring = pts.slice();
  if (dist(ring[0], ring[ring.length - 1]) < 0.75) ring.pop();
  if (ring.length < 3) return pts;

  let far = 1, best = -1;
  for (let i = 1; i < ring.length; i++) {
    const d = dist(ring[0], ring[i]);
    if (d > best) { best = d; far = i; }
  }
  const a = sk2Rdp(ring.slice(0, far + 1), eps);
  const b = sk2Rdp(ring.slice(far).concat([ring[0]]), eps);
  const out = a.concat(b.slice(1));
  if (out.length >= 3) return out;

  // Last resort: uniform decimation, so a polygon never vanishes.
  const step = Math.max(1, Math.ceil(ring.length / 24));
  const dec = ring.filter((_, i) => i % step === 0);
  return dec.length >= 3 ? dec : ring.slice(0, Math.min(ring.length, 3));
}

// Desmos takes filled polygons, not strokes, so the picture must be built from
// closed regions. Shapes are emitted back-to-front and every one is filled,
// which is what removes the gaps and holes the stroke export had.
function buildPolygons(tracedata, eps, maxShapes) {
  const shapes = [];
  (tracedata.layers || []).forEach((layer, li) => {
    for (const smp of layer) {
      const pts = flattenPath(smp);
      if (pts.length < 3) continue;
      const simp = simplifyPolygon(pts, eps);
      if (simp.length < 3) continue;
      let area = 0;
      for (let i = 0; i < simp.length; i++) {
        const [x1, y1] = simp[i], [x2, y2] = simp[(i + 1) % simp.length];
        area += x1 * y2 - x2 * y1;
      }
      shapes.push({ layer: li, pts: simp, area: Math.abs(area) / 2 });
    }
  });
  shapes.sort((a, b) => a.layer - b.layer || b.area - a.area);
  const kept = shapes.slice(0, maxShapes);
  return { shapes: kept, total: shapes.length };
}

function paletteColor(palette, i) {
  const c = palette && palette[i];
  if (!c) return 'rgb(80,80,80)';
  if (Array.isArray(c)) return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  // imagetracer's palette entries are {r,g,b,a} objects, not arrays.
  if (typeof c === 'object' && c.r !== undefined) {
    return `rgb(${c.r | 0},${c.g | 0},${c.b | 0})`;
  }
  return 'rgb(80,80,80)';
}

function toHex(rgb) {
  const m = /rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(rgb);
  if (!m) return '#ffffff';
  return '#' + [1, 2, 3].map(i => (+m[i]).toString(16).padStart(2, '0')).join('');
}

// Filled preview: exactly the geometry that goes to Desmos, so what you see is
// what you paste. A hairline stroke in the same colour seals seams.
function renderPolygons(shapes, palette, gw, gh) {
  const { W, H, sc, ox, oy } = viewport(gw, gh);
  const X = x => (ox + x*sc).toFixed(1);
  const Y = y => (oy + y*sc).toFixed(1);
  let html = `<rect width="${W}" height="${H}" fill="#fff"/>`;
  for (const s of shapes) {
    const col = paletteColor(palette, s.layer);
    const d = s.pts.map(([x, y], i) => `${i ? 'L' : 'M'}${X(x)} ${Y(y)}`).join('') + 'Z';
    html += `<path d="${d}" fill="${col}" stroke="${col}" stroke-width="0.6" stroke-linejoin="round"/>`;
  }
  $('svg').innerHTML = html;
}

function buildDesmosExpressions(shapes, palette, w, h) {
  const span = 10;
  const sc = span / Math.max(w, h);
  const X = x => (x * sc).toFixed(2);
  const Y = y => ((h - y) * sc).toFixed(2);
  const call = pts => `\\operatorname{polygon}\\left(${pts.map(([x, y]) => `\\left(${X(x)},${Y(y)}\\right)`).join(',')}\\right)`;

  // One expression per colour layer. Desmos fills comma-separated polygon calls
  // inside a single expression, and an expression carries exactly one colour,
  // so this turns one colour pick per shape into one per layer.
  const byLayer = new Map();
  for (const s of shapes) {
    if (!byLayer.has(s.layer)) byLayer.set(s.layer, []);
    byLayer.get(s.layer).push(call(s.pts));
  }

  // The base canvas is kept in its own first expression: no backdrop can show
  // through, and draw order inside a single expression is not guaranteed.
  const exprs = [`\\operatorname{polygon}\\left(\\left(0,0\\right),\\left(${(w*sc).toFixed(2)},0\\right),\\left(${(w*sc).toFixed(2)},${(h*sc).toFixed(2)}\\right),\\left(0,${(h*sc).toFixed(2)}\\right)\\right)`];
  const legend = [{ label: 'base canvas', n: 1, color: lastBgColor }];
  for (const li of [...byLayer.keys()].sort((a, b) => a - b)) {
    const calls = byLayer.get(li);
    exprs.push(calls.join(','));
    legend.push({ label: 'layer ' + li, n: calls.length, color: paletteColor(palette, li) });
  }
  return { exprs, legend };
}

// A photo backdrop posterises into jagged black/white shards, which read as
// noise rather than drawing. Flood the border-connected pixels to one flat
// colour so the subject sits on a clean ground.
function flattenBackground(ctx, w, h, tol) {
  const imgd = ctx.getImageData(0, 0, w, h);
  const d = imgd.data;
  const at = (x, y) => (y * w + x) * 4;

  const rs = [], gs = [], bs = [];
  for (let x = 0; x < w; x++) {
    for (const y of [0, h - 1]) {
      const i = at(x, y);
      if (d[i + 3] > 8) { rs.push(d[i]); gs.push(d[i + 1]); bs.push(d[i + 2]); }
    }
  }
  for (let y = 0; y < h; y++) {
    for (const x of [0, w - 1]) {
      const i = at(x, y);
      if (d[i + 3] > 8) { rs.push(d[i]); gs.push(d[i + 1]); bs.push(d[i + 2]); }
    }
  }
  if (!rs.length) return 0;
  const med = a => { a.sort((p, q) => p - q); return a[a.length >> 1]; };
  const br = med(rs), bg = med(gs), bb = med(bs);

  const close = i => Math.abs(d[i] - br) + Math.abs(d[i+1] - bg) + Math.abs(d[i+2] - bb) <= tol;
  const seen = new Uint8Array(w * h);
  const stack = [];
  for (let x = 0; x < w; x++) stack.push(x, 0, x, h - 1);
  for (let y = 0; y < h; y++) stack.push(0, y, w - 1, y);

  let painted = 0;
  while (stack.length) {
    const y = stack.pop(), x = stack.pop();
    if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const p = y * w + x;
    if (seen[p]) continue;
    seen[p] = 1;
    const i = p * 4;
    if (!close(i)) continue;
    d[i] = br; d[i + 1] = bg; d[i + 2] = bb; d[i + 3] = 255;
    painted++;
    stack.push(x - 1, y, x + 1, y, x, y - 1, x, y + 1);
  }
  ctx.putImageData(imgd, 0, 0);
  lastBgColor = `rgb(${br},${bg},${bb})`;
  return painted;
}

function runLine(ctx, w, h, kind) {
  const cleanup = +$('cleanup').value;
  const bitonal = kind === 'flat';
  const art = buildCenterlineFromInk(gridFrom(ctx, w, h), {
    ink: 0.5,
    minBlob: Math.round(cleanup * 1.5),
    minStrokeLen: cleanup,
    eps: 1.0,
    smoothIters: 3,
    stitch: 2.5,
    xdog: bitonal ? null : {
      sigma: +$('sigma').value,
      k: 1.6,
      p: 0.98,
      tau: +$('tau').value
    }
  });
  const lw = +$('lwLine').value;
  renderLines(art.lines, w, h, lw);
  lastArt = { kind: 'line', lines: art.lines, gridW: w, gridH: h, lw };
  return `${art.count} strokes, ${art.points} points`;
}

function runVector(ctx, w, h) {
  if (typeof ImageTracer === 'undefined') throw new Error('tracer failed to load');
  if ($('bgClean').checked) flattenBackground(ctx, w, h, 60);
  const opts = {
    numberofcolors: +$('colors').value,
    ltres: 2, qtres: 2,
    pathomit: +$('simplify').value,
    rightangleenhance: true,
    blurradius: +$('blur').value,
    strokewidth: 0,
    linefilter: false,
    scale: 1, roundcoords: 2, viewbox: true, desc: false
  };
  const imgd = ctx.getImageData(0, 0, w, h);
  let svgStr = ImageTracer.imagedataToSVG(imgd, opts);
  // A photographic source can shatter into thousands of scraps; raise the
  // path-size floor until the count is drawable.
  let nPaths = (svgStr.match(/<path /g) || []).length;
  for (let tries = 0; nPaths > 900 && tries < 3; tries++) {
    opts.pathomit = Math.min(80, opts.pathomit + 25);
    svgStr = ImageTracer.imagedataToSVG(imgd, opts);
    nPaths = (svgStr.match(/<path /g) || []).length;
  }
  const tracedata = ImageTracer.imagedataToTracedata(imgd, opts);
  const { shapes, total } = buildPolygons(tracedata, 1.2, 320);
  renderPolygons(shapes, tracedata.palette, w, h);
  lastArt = { kind: 'poly', shapes, palette: tracedata.palette, gridW: w, gridH: h };
  return `${shapes.length} filled regions (of ${total}), ${+$('colors').value} colours`;
}

$('draw').addEventListener('click', () => {
  if (!img) { $('info').textContent = 'Pick an image first.'; return; }
  $('info').textContent = 'Drawing...';
  setTimeout(() => {
    try {
      const { ctx, w, h } = drawToCanvas();
      const t0 = performance.now();
      const chosen = $('mode').value;
      const kind = chosen === 'auto' ? classify(ctx, w, h) : (chosen === 'line' ? 'sketch' : 'photo');

      let summary;
      if (chosen === 'vector' || (chosen === 'auto' && kind === 'photo')) {
        summary = runVector(ctx, w, h);
      } else {
        summary = runLine(ctx, w, h, kind);
      }

      const ms = Math.round(performance.now() - t0);
      const label = chosen === 'auto' ? `auto: ${kind}` : chosen;
      $('info').textContent = `${summary}, ${ms}ms (${label}).`;
    } catch (err) {
      $('info').textContent = 'Error: ' + err.message;
      throw err;
    }
  }, 30);
});

$('clear').addEventListener('click', () => {
  $('svg').innerHTML = '';
  $('info').textContent = '';
  lastArt = null;
});

$('save').addEventListener('click', () => {
  if (!lastArt) { $('info').textContent = 'Draw something first.'; return; }
  const svg = $('svg');
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', svg.clientWidth || 900);
  clone.setAttribute('height', svg.clientHeight || 900);
  const blob = new Blob([clone.outerHTML], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lineart.svg';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('desmos').addEventListener('click', () => {
  if (!lastArt || lastArt.kind !== 'poly' || !lastArt.shapes.length) {
    $('info').textContent = 'Desmos export needs filled regions. Choose Outline trace (or Auto on a photo), then Draw.';
    return;
  }
  const { exprs, legend } = buildDesmosExpressions(lastArt.shapes, lastArt.palette, lastArt.gridW, lastArt.gridH);
  lastExport = { exprs, legend };
  $('desmosOut').value = exprs.join('\n');
  $('desmosWrap').hidden = false;
  // One expression per colour means one colour pick per layer in Desmos, so the
  // legend names the colour each row should get.
  $('desmosInfo').innerHTML =
    `${exprs.length} expressions, one per colour — so ${exprs.length} colour picks total instead of ${lastArt.shapes.length}.<br>` +
    legend.map((l, i) => `${i + 1}. ${l.label}: ${l.n} shape${l.n > 1 ? 's' : ''} ` +
      `<span style="display:inline-block;width:10px;height:10px;background:${l.color};border:1px solid #888;vertical-align:-1px"></span> ${l.color}`).join('<br>');
  $('info').textContent = 'Desmos export ready.';
});

$('copyDesmos').addEventListener('click', async () => {
  const t = $('desmosOut');
  t.focus();
  t.select();
  try {
    await navigator.clipboard.writeText(t.value);
    $('info').textContent = `Copied ${t.value.split('\n').length} expressions.`;
  } catch (e) {
    document.execCommand('copy');
    $('info').textContent = 'Copied.';
  }
});

// Desmos' swatch list is a fixed handful of presets, so a photo palette cannot
// be matched by clicking. The calculator API does accept any hex, so hand over
// one paste that sets every layer's real colour and makes the fills solid.
$('copyColor').addEventListener('click', async () => {
  if (!lastExport) { $('info').textContent = 'Export for Desmos first.'; return; }
  const hexes = lastExport.legend.map(l => toHex(l.color));
  const script =
    `const C=${JSON.stringify(hexes)};` +
    `Calc.getState().expressions.list.forEach((e,i)=>{if(C[i])Calc.setExpression({id:e.id,color:C[i],fillOpacity:1});});`;
  $('desmosOut').value = script;
  $('desmosOut').focus();
  $('desmosOut').select();
  try {
    await navigator.clipboard.writeText(script);
    $('info').textContent = 'Colour script copied — paste it into the browser console on your Desmos tab.';
  } catch (e) {
    document.execCommand('copy');
    $('info').textContent = 'Colour script written to the box — copy it into the browser console on your Desmos tab.';
  }
});

function redraw() {
  if (!lastArt) return;
  if (lastArt.kind === 'line') renderLines(lastArt.lines, lastArt.gridW, lastArt.gridH, lastArt.lw);
  else if (lastArt.kind === 'poly') renderPolygons(lastArt.shapes, lastArt.palette, lastArt.gridW, lastArt.gridH);
}

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(redraw, 150);
});
</script>
</body>

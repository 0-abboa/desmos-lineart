<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image to line art</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;display:flex;height:100vh}
  #side{width:330px;padding:16px;box-sizing:border-box;border-right:1px solid #ddd;overflow:auto;flex:none}
  #side h3{margin:0 0 8px}
  #side h4{margin:16px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#888}
  #side label{display:block;margin-top:10px;font-size:13px}
  #side input[type=range],#side select{width:100%}
  #side button{margin-top:10px;padding:8px;width:100%;cursor:pointer}
  #main{flex:1;background:#fff;min-width:0}
  #svg{width:100%;height:100%;display:block}
  .muted{color:#666;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div id="side">
  <h3>Image to line art</h3>
  <input type="file" id="file" accept="image/*">

  <label>Output
    <select id="mode">
      <option value="auto">Auto (recommended)</option>
      <option value="line">Single-line art</option>
      <option value="vector">Outline trace</option>
    </select>
  </label>

  <label>Resolution <span id="resV"></span>
    <input type="range" id="res" min="300" max="900" step="20" value="700"></label>

  <h4>Single-line</h4>
  <label>Softness (sigma) <span id="sigmaV"></span>
    <input type="range" id="sigma" min="0.8" max="3.0" step="0.1" value="1.8"></label>
  <label>Ink threshold <span id="tauV"></span>
    <input type="range" id="tau" min="0.30" max="0.70" step="0.01" value="0.45"></label>
  <label>Cleanup <span id="cleanupV"></span>
    <input type="range" id="cleanup" min="0" max="40" step="1" value="8"></label>
  <label>Line width <span id="lwLineV"></span>
    <input type="range" id="lwLine" min="0.4" max="2.4" step="0.1" value="1.4"></label>

  <h4>Outline trace</h4>
  <label>Colours <span id="colorsV"></span>
    <input type="range" id="colors" min="2" max="16" step="1" value="4"></label>
  <label>Cleanup <span id="simplifyV"></span>
    <input type="range" id="simplify" min="0" max="80" step="2" value="60"></label>
  <label>Denoise <span id="blurV"></span>
    <input type="range" id="blur" min="0" max="3" step="1" value="2"></label>
  <label>Line width <span id="lwVecV"></span>
    <input type="range" id="lwVec" min="0.4" max="2.4" step="0.1" value="0.9"></label>
  <label><input type="checkbox" id="fill" /> Fill shapes (solid logos)</label>

  <button id="draw">Draw image</button>
  <button id="clear">Clear</button>
  <button id="save">Save as SVG</button>

  <p id="info" class="muted"></p>
  <p class="muted"><b>Auto</b> picks an engine from the image: flat icons get a hard threshold, sketches get XDoG ink extraction, photographs get a flat-colour outline trace. Override with the Output menu.</p>
</div>
<div id="main"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>

<script src="imagetracer.js"></script>
<script src="skeleton.js"></script>
<script>
const $ = id => document.getElementById(id);
let img = null, lastArt = null;

const SHOWN = ['res','sigma','tau','cleanup','lwLine','colors','simplify','blur','lwVec'];
SHOWN.forEach(id => {
  const show = () => { const v = $(id + 'V'); if (v) v.textContent = $(id).value; };
  $(id).addEventListener('input', show); show();
});

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const im = new Image();
  im.onload = () => {
    img = im;
    $('info').textContent = `Loaded ${im.width}x${im.height}. Click Draw image.`;
  };
  im.src = URL.createObjectURL(f);
});

// Scale to the working resolution in both directions: a small source has too
// few pixels for any renderer to find strokes, so upscale rather than trace a
// thumbnail. Capped so a tiny icon does not become mush.
function drawToCanvas() {
  const R = +$('res').value;
  const s = Math.min(4, R / Math.max(img.width, img.height));
  const w = Math.max(8, Math.round(img.width * s));
  const h = Math.max(8, Math.round(img.height * s));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);
  return { ctx, w, h };
}

function gridFrom(ctx, w, h) {
  const px = ctx.getImageData(0, 0, w, h).data;
  const v = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const L = (0.299 * px[4*i] + 0.587 * px[4*i+1] + 0.114 * px[4*i+2]) / 255;
    v[i] = 1 - L;
  }
  return { w, h, v };
}

// flat   -> two-tone art: exact threshold keeps shapes crisp
// sketch -> ink on light paper: XDoG keeps faint strokes connected
// photo  -> continuous tone: flat-colour outline trace is the only one that holds a face
function classify(ctx, w, h) {
  const px = ctx.getImageData(0, 0, w, h).data;
  const n = w * h;
  let flat = 0, dark = 0, sum = 0;
  for (let i = 0; i < n; i++) {
    const L = (0.299 * px[4*i] + 0.587 * px[4*i+1] + 0.114 * px[4*i+2]) / 255;
    sum += L;
    if (L < 0.2 || L > 0.8) flat++;
    if (L < 0.35) dark++;
  }
  const mean = sum / n;
  const flatFrac = flat / n;
  const darkFrac = dark / n;
  if (flatFrac > 0.85) return 'flat';
  if (mean > 0.62 && darkFrac > 0.005 && darkFrac < 0.35) return 'sketch';
  return 'photo';
}

function viewport(gw, gh) {
  const svg = $('svg');
  const W = Math.round(svg.clientWidth || window.innerWidth * 0.66);
  const H = Math.round(svg.clientHeight || window.innerHeight);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pad = 16;
  const sc = Math.min((W - 2*pad) / gw, (H - 2*pad) / gh);
  const ox = (W - gw*sc) / 2, oy = (H - gh*sc) / 2;
  return { W, H, sc, ox, oy };
}

function strokePath(lines, X, Y) {
  let d = '';
  for (const pts of lines) {
    if (!pts || pts.length < 2) continue;
    d += `M${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i+1][0]) / 2;
      const my = (pts[i][1] + pts[i+1][1]) / 2;
      d += `Q${X(pts[i][0]).toFixed(1)} ${Y(pts[i][1]).toFixed(1)} ${X(mx).toFixed(1)} ${Y(my).toFixed(1)}`;
    }
    const last = pts[pts.length - 1];
    d += `L${X(last[0]).toFixed(1)} ${Y(last[1]).toFixed(1)}`;
  }
  return d;
}

function renderLines(lines, gw, gh, lw) {
  const { W, H, sc, ox, oy } = viewport(gw, gh);
  const X = x => ox + x*sc, Y = y => oy + y*sc;
  const d = strokePath(lines, X, Y);
  $('svg').innerHTML = `<rect width="${W}" height="${H}" fill="#fff"/>` +
    `<path d="${d}" fill="none" stroke="#000" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function renderVector(tracerSvg, gw, gh, filled, lw) {
  const { W, H, sc, ox, oy } = viewport(gw, gh);
  const doc = new DOMParser().parseFromString(tracerSvg, 'image/svg+xml');
  const paths = Array.from(doc.querySelectorAll('path'));
  const sw = (lw / sc).toFixed(3);
  let html = `<rect width="${W}" height="${H}" fill="#fff"/><g transform="translate(${ox.toFixed(2)},${oy.toFixed(2)}) scale(${sc.toFixed(4)})">`;
  for (const p of paths) {
    const d = p.getAttribute('d');
    if (!d) continue;
    const fill = filled ? (p.getAttribute('fill') || '#000') : 'none';
    const stroke = filled ? 'none' : '#000';
    html += `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  html += '</g>';
  $('svg').innerHTML = html;
  return paths.length;
}

function runLine(ctx, w, h, kind) {
  const cleanup = +$('cleanup').value;
  const bitonal = kind === 'flat';
  const art = buildCenterlineFromInk(gridFrom(ctx, w, h), {
    ink: 0.5,
    minBlob: Math.round(cleanup * 1.5),
    minStrokeLen: cleanup,
    eps: 1.0,
    smoothIters: 3,
    stitch: 2.5,
    xdog: bitonal ? null : {
      sigma: +$('sigma').value,
      k: 1.6,
      p: 0.98,
      tau: +$('tau').value
    }
  });
  const lw = +$('lwLine').value;
  renderLines(art.lines, w, h, lw);
  lastArt = { kind: 'line', lines: art.lines, gridW: w, gridH: h, lw };
  return `${art.count} strokes, ${art.points} points`;
}

function runVector(ctx, w, h) {
  if (typeof ImageTracer === 'undefined') throw new Error('tracer failed to load');
  const opts = {
    numberofcolors: +$('colors').value,
    ltres: 2, qtres: 2,
    pathomit: +$('simplify').value,
    rightangleenhance: true,
    blurradius: +$('blur').value,
    strokewidth: 0,
    linefilter: false,
    scale: 1, roundcoords: 2, viewbox: true, desc: false
  };
  const imgd = ctx.getImageData(0, 0, w, h);
  let svgStr = ImageTracer.imagedataToSVG(imgd, opts);
  // A photographic source can shatter into thousands of scraps; raise the
  // path-size floor until the count is drawable.
  let nPaths = (svgStr.match(/<path /g) || []).length;
  for (let tries = 0; nPaths > 900 && tries < 3; tries++) {
    opts.pathomit = Math.min(80, opts.pathomit + 25);
    svgStr = ImageTracer.imagedataToSVG(imgd, opts);
    nPaths = (svgStr.match(/<path /g) || []).length;
  }
  const filled = $('fill').checked;
  const lw = +$('lwVec').value;
  const n = renderVector(svgStr, w, h, filled, lw);
  lastArt = { kind: 'vector', vector: svgStr, gridW: w, gridH: h, filled, lw };
  return `${n} paths, ${+$('colors').value} colours`;
}

$('draw').addEventListener('click', () => {
  if (!img) { $('info').textContent = 'Pick an image first.'; return; }
  $('info').textContent = 'Drawing...';
  setTimeout(() => {
    try {
      const { ctx, w, h } = drawToCanvas();
      const t0 = performance.now();
      const chosen = $('mode').value;
      const kind = chosen === 'auto' ? classify(ctx, w, h) : (chosen === 'line' ? 'sketch' : 'photo');

      let summary;
      if (chosen === 'vector' || (chosen === 'auto' && kind === 'photo')) {
        summary = runVector(ctx, w, h);
      } else {
        summary = runLine(ctx, w, h, kind);
      }

      const ms = Math.round(performance.now() - t0);
      const label = chosen === 'auto' ? `auto: ${kind}` : chosen;
      $('info').textContent = `${summary}, ${ms}ms (${label}).`;
    } catch (err) {
      $('info').textContent = 'Error: ' + err.message;
      throw err;
    }
  }, 30);
});

$('clear').addEventListener('click', () => {
  $('svg').innerHTML = '';
  $('info').textContent = '';
  lastArt = null;
});

$('save').addEventListener('click', () => {
  if (!lastArt) { $('info').textContent = 'Draw something first.'; return; }
  const svg = $('svg');
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', svg.clientWidth || 900);
  clone.setAttribute('height', svg.clientHeight || 900);
  const blob = new Blob([clone.outerHTML], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lineart.svg';
  a.click();
  URL.revokeObjectURL(a.href);
});

function redraw() {
  if (!lastArt) return;
  if (lastArt.kind === 'line') renderLines(lastArt.lines, lastArt.gridW, lastArt.gridH, lastArt.lw);
  else if (lastArt.kind === 'vector') renderVector(lastArt.vector, lastArt.gridW, lastArt.gridH, lastArt.filled, lastArt.lw);
}

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(redraw, 150);
});
</script>
</body>
</html>

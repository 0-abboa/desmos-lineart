<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image to line art</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;display:flex;height:100vh}
  #side{width:310px;padding:16px;box-sizing:border-box;border-right:1px solid #ddd;overflow:auto;flex:none}
  #side h3{margin:0 0 8px}
  #side label{display:block;margin-top:10px;font-size:13px}
  #side input[type=range]{width:100%}
  #side button{margin-top:10px;padding:8px;width:100%;cursor:pointer}
  #main{flex:1;position:relative;background:#fff;min-width:0;display:flex;align-items:center;justify-content:center}
  #svg{width:100%;height:100%;display:block}
  .muted{color:#666;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div id="side">
  <h3>Image to line art</h3>
  <input type="file" id="file" accept="image/*">

  <label>Resolution <span id="resV"></span>
    <input type="range" id="res" min="160" max="700" step="20" value="480"></label>
  <label>Contrast <span id="gammaV"></span>
    <input type="range" id="gamma" min="0.4" max="2.2" step="0.05" value="1"></label>
  <label>Smoothing <span id="smoothV"></span>
    <input type="range" id="smooth" min="1" max="8" step="1" value="5"></label>
  <label>Line spacing <span id="spacingV"></span>
    <input type="range" id="spacing" min="1.4" max="4" step="0.1" value="2.2"></label>
  <label>Darkness floor <span id="thrV"></span>
    <input type="range" id="thr" min="0.02" max="0.40" step="0.01" value="0.14"></label>
  <label style="margin-top:12px">Output
    <select id="mode" style="width:100%;margin-top:4px;padding:4px">
      <option value="both">Hatching + edges</option>
      <option value="hatch">Hatching only</option>
      <option value="edges">Edges only</option>
    </select>
  </label>

  <button id="draw">Draw image</button>
  <button id="clear">Clear</button>
  <button id="save">Save as SVG</button>

  <p id="info" class="muted"></p>
  <p class="muted">Engraving-style hatching: parallel strokes whose density carries the tone. Smoothing trades detail for cleaner lines - raise it if busy areas turn muddy.</p>
</div>
<div id="main"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>

<script src="lineart.js"></script>
<script>
const $ = id => document.getElementById(id);
const WORLD_W = 100;             // drawing width in graph units
let img = null, lastArt = null, lastH = 100;

['res','gamma','smooth','spacing','thr'].forEach(id => {
  const show = () => $(id + 'V').textContent = $(id).value;
  $(id).addEventListener('input', show); show();
});

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const im = new Image();
  im.onload = () => {
    img = im;
    $('info').textContent = `Loaded ${im.width}x${im.height}. Click Draw image.`;
  };
  im.src = URL.createObjectURL(f);
});

// Image -> darkness grid (0 = white, 1 = black).
function buildGrid() {
  const R = +$('res').value;
  const s = Math.min(1, R / Math.max(img.width, img.height));
  const w = Math.max(8, Math.round(img.width * s));
  const h = Math.max(8, Math.round(img.height * s));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const px = ctx.getImageData(0, 0, w, h).data;
  const gam = +$('gamma').value;
  const v = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const L = (0.299 * px[4*i] + 0.587 * px[4*i+1] + 0.114 * px[4*i+2]) / 255;
    v[i] = Math.pow(1 - L, gam);
  }
  return { w, h, v, H: WORLD_W * h / w };
}

// Draw strokes as a few paths, bucketed by width so line weight can vary.
function renderSVG(art, H) {
  const svg = $('svg');
  const W = Math.round(svg.clientWidth || window.innerWidth * 0.66);
  const HH = Math.round(svg.clientHeight || window.innerHeight);
  svg.setAttribute('viewBox', `0 0 ${W} ${HH}`);

  const pad = 16;
  const gw = art.gridW, gh = art.gridH;
  const sc = Math.min((W - 2*pad) / gw, (HH - 2*pad) / gh);
  const ox = (W - gw*sc) / 2, oy = (HH - gh*sc) / 2;
  const px = x => ox + x*sc, py = y => oy + y*sc;

  const buckets = new Map();
  for (const st of art.strokes) {
    const key = Math.round(st.width * 8) / 8;      // quantise weight
    let d = buckets.get(key);
    if (d === undefined) { d = ''; buckets.set(key, d); }
    d += `M${px(st.xs[0]).toFixed(1)} ${py(st.ys[0]).toFixed(1)}`;
    for (let i = 1; i < st.xs.length; i++) {
      d += `L${px(st.xs[i]).toFixed(1)} ${py(st.ys[i]).toFixed(1)}`;
    }
    buckets.set(key, d);
  }

  let html = `<rect width="${W}" height="${HH}" fill="#fff"/>`;
  for (const [wgt, d] of buckets) {
    html += `<path d="${d}" fill="none" stroke="#000" stroke-width="${wgt.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  svg.innerHTML = html;
}

$('draw').addEventListener('click', () => {
  if (!img) { $('info').textContent = 'Pick an image first.'; return; }
  $('info').textContent = 'Drawing...';
  setTimeout(() => {
    try {
      const grid = buildGrid();
      const t0 = performance.now();
      const mode = $('mode').value;
      const opts = {
        preBlur: +$('smooth').value,
        spacing: +$('spacing').value,
        thr: +$('thr').value,
        edgePass: mode !== 'hatch'
      };
      if (mode === 'edges') opts.angles = [];   // no hatch layers at all
      const art = buildLineArt(grid, opts);
      const ms = Math.round(performance.now() - t0);
      lastArt = art; lastH = grid.H;
      renderSVG(art, grid.H);
      let pts = 0;
      for (const st of art.strokes) pts += st.xs.length;
      $('info').textContent = `${art.strokes.length} strokes, ${pts} points, ${ms}ms.`;
    } catch (err) {
      $('info').textContent = 'Error: ' + err.message;
      throw err;
    }
  }, 30);
});

$('clear').addEventListener('click', () => {
  $('svg').innerHTML = '';
  $('info').textContent = '';
  lastArt = null;
});

$('save').addEventListener('click', () => {
  if (!lastArt) { $('info').textContent = 'Draw something first.'; return; }
  const svg = $('svg');
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', svg.clientWidth || 900);
  clone.setAttribute('height', svg.clientHeight || 900);
  const blob = new Blob([clone.outerHTML], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lineart.svg';
  a.click();
  URL.revokeObjectURL(a.href);
});

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (lastArt) renderSVG(lastArt, lastH); }, 150);
});
</script>
</body>
</html>
